<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brisling Consulting AS</title>
<meta name="description" content="Brisling Consulting AS — nettside kommer snart.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b1220;
    --fg: #f5f7fa;
    --accent: #6fa8ff;
    --muted: #9aa7bd;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
  }
  p.tagline {
    color: var(--muted);
    font-size: 1.1rem;
    margin: 0 0 2rem;
  }
  p.status {
    color: var(--accent);
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0;
  }
  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  a {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Brisling Consulting AS</h1>
  <p class="tagline">Nettsiden er under arbeid.</p>
  <p class="status">Coming soon</p>
  <footer>
    <a href="mailto:post@brisling.no">post@brisling.no</a>
  </footer>
</main>
</body>
</html>
